services:
  bytebandits:
    container_name: bytebandits
    image: ghcr.io/byte-bandits-india/bytebandits:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
