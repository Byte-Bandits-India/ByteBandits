name: Deploy Dockerized Next.js to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: bytebandits:latest
          outputs: type=docker,dest=/tmp/bytebandits.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress Docker Image
        run: |
          gzip -f /tmp/bytebandits.tar
          mv /tmp/bytebandits.tar.gz ./bytebandits.tar.gz
          ls -lh ./bytebandits.tar.gz

      - name: Copy Docker Image to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.206.146.163
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          source: "bytebandits.tar.gz"
          target: "/home/ec2-user"

      - name: Deploy Docker Container via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.206.146.163
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            # Ensure Docker is installed
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              sudo yum update -y && sudo yum install -y docker || sudo apt-get update -y && sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
              sudo usermod -aG docker ec2-user 2>/dev/null || true
            fi

            # Ensure Docker daemon is running
            sudo systemctl start docker || sudo service docker start || true

            # Determine docker command prefix (sudo if needed)
            if docker ps >/dev/null 2>&1; then
              DOCKER_CMD="docker"
            else
              DOCKER_CMD="sudo docker"
            fi

            echo "Loading Docker image..."
            $DOCKER_CMD load < /home/ec2-user/bytebandits.tar.gz
            rm -f /home/ec2-user/bytebandits.tar.gz

            echo "Detecting environment file..."
            ENV_FLAG=""
            if [ -f /home/ec2-user/.env.local ]; then
              echo "Using /home/ec2-user/.env.local"
              ENV_FLAG="--env-file /home/ec2-user/.env.local"
            elif [ -f /home/ec2-user/.env ]; then
              echo "Using /home/ec2-user/.env"
              ENV_FLAG="--env-file /home/ec2-user/.env"
            else
              echo "WARNING: No .env.local or .env found in /home/ec2-user"
            fi

            echo "Stopping legacy PM2 process if active..."
            pm2 delete byteBandits 2>/dev/null || true
            pm2 save 2>/dev/null || true

            echo "Stopping existing Docker container..."
            $DOCKER_CMD stop bytebandits 2>/dev/null || true
            $DOCKER_CMD rm bytebandits 2>/dev/null || true

            echo "Starting new Docker container..."
            $DOCKER_CMD run -d \
              --name bytebandits \
              --restart always \
              -p 127.0.0.1:3000:3000 \
              $ENV_FLAG \
              bytebandits:latest

            echo "Cleaning up dangling images..."
            $DOCKER_CMD image prune -f

            echo "Reloading Nginx..."
            sudo systemctl reload nginx || sudo systemctl restart nginx || true

            echo "Deployment complete! Application is running in Docker."